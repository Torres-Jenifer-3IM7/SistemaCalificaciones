<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Sistema de Calificaciones</title>

        <link rel="stylesheet" href="estilos.css">
    </head>

    <body>

        <div class="contenedor">

            <h1>Sistema de Calificaciones</h1>

            <p>Captura las calificaciones del alumno</p>


            <div class="formulario">

                <label for="nombre">Nombre del alumno:</label>
                <input type="text" id="nombre" placeholder="Escribe el nombre">

                <label for="calificacion1">Edad:</label>
                <input type="number" id="edadcita" min="0" max="100">

                <label for="calificacion1">Calificación 1:</label>
                <input type="number" id="calificacion1" min="0" max="10">

                <label for="calificacion2">Calificación 2:</label>
                <input type="number" id="calificacion2" min="0" max="10">

                <label for="calificacion3">Calificación 3:</label>
                <input type="number" id="calificacion3" min="0" max="10">

                <button onclick="calcularPromedio()">
                    Calcular promedio
                </button>
                
                <button onclick="limpiar()">
                    Limpiar
                </button>
                <button onclick="borrarTodo()">
                    Borrar Registros
                </button>
                <button onclick="otro()">
                    Agregar
                </button>

            </div>

            <div id="resultado" class="resultado">

            </div>

            <div id="listaResultados">
            </div>

        </div>

        <script src="script.js"></script>

    </body>

</html>
